name: "MeshSim"
# sim-mode: "Frame-by-frame"
# sim-mode: "AFAP"
time-step: 1e-2
end-time: 10

camera-position: [10, 10, 10]

# logging: True
# logging-output-folder: "../output/convergence"
# logging-interval: 10
# log-residuals: True

hdr-image-filename: "../resource/studio_1k.hdr"
create-skybox: True
hdr-scaling: 0.2

ground-plane: True

objects:
  - 
    type: "TetMeshObject"
    name: "test"
    filename: "../resource/cube2.msh"
    position: [0, 1.5, 0]
    scaling: [0.5, 0.5, 0.5]
    # material parameters
    E: 1e6
    nu: 0.45
    density: 1000

    # render settings
    smooth-normals: False
    draw-edges: True
    draw-faces: True
    color: [1.0, 0.5, 0]