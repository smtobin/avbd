name: "MeshSim"
sim-mode: "Frame-by-frame"
# sim-mode: "AFAP"
time-step: 1e-3
end-time: 10
solver-iters: 100

camera-position: [5, 5, 5]

# logging: True
# logging-output-folder: "../output/convergence"
# logging-interval: 10
# log-residuals: True

hdr-image-filename: "../resource/studio_1k.hdr"
create-skybox: True
hdr-scaling: 0.2

ground-plane: True

objects:
  - 
    type: "TetMeshObject"
    name: "test"
    filename: "../resource/cube8.msh"
    position: [0, 1, 0]
    scaling: [1, 1, 1]
    # material parameters
    E: 70
    nu: 0.45
    density: 1e-6

    # render settings
    smooth-normals: False
    draw-edges: True
    draw-faces: True
    color: [1.0, 0.5, 0]