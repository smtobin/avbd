name: "MeshSim"
# sim-mode: "Frame-by-frame"
# sim-mode: "AFAP"
time-step: 1e-3 # s
end-time: 1
g-accel: 9.81 # m/s^2
solver-iters: 15
iter-acceleration: 0.95
num-threads: 12
collision-margin: 1e-4

camera-position: [50e-3, 50e-3, 50e-3]

# logging: True
# logging-output-folder: "../output/convergence"
# logging-interval: 10
# log-residuals: True

hdr-image-filename: "../resource/studio_1k.hdr"
create-skybox: True
hdr-scaling: 0.2
fancy-graphics: false

ground-plane: True

objects:
  - 
    type: "TetMeshObject"
    name: "test"
    filename: "../resource/tumor.msh"
    position: [0, 10e-3, 0]
    scaling: [1e-3, 1e-3, 1e-3]
    velocity: [0, 0, 0]
    position-by-com: true
    # material parameters
    E: 20e3 # Pa (0.35 = roughly chicken breast: https://academic.oup.com/mt/article/31/2/21/7116012)
    nu: 0.45
    density: 1000 # kg / m^3
    damping-coeff: 1e-6 # ?

    # render settings
    smooth-normals: False
    draw-edges: True
    draw-faces: True
    color: [1.0, 0.5, 0]

  - 
    type: "Rod"
    name: "rod"
    position: [3e-3, 20e-3, -10e-3]
    base-fixed: false
    E: 5e4
    nu: 0.4
    diameter: 1e-3
    length: 20e-3
    density: 1000 # kg / m^3
    elements: 20
    color: [1, 0, 0]

  # - 
  #   type: "RigidSphere"
  #   fixed: false
  #   position: [0, 20e-3, 0]
  #   radius: 3e-3
  #   density: 10000 # kg / mm^3