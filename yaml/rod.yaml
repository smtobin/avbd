name: "MeshSim"
sim-mode: "Frame-by-frame"
# sim-mode: "AFAP"
time-step: 1e-3 # s
end-time: 3
g-accel: 9.81 # m/s^2
solver-iters: 15
iter-acceleration: 0.95
num-threads: 12
collision-margin: 1e-3

camera-position: [50, 50, 50]

# logging: True
# logging-output-folder: "../output/convergence"
# logging-interval: 10
# log-residuals: True

hdr-image-filename: "../resource/studio_1k.hdr"
create-skybox: True
hdr-scaling: 0.3
fancy-graphics: false

ground-plane: True

objects:
  - 
    type: "Rod"
    name: "rod"