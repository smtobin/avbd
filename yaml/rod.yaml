name: "MeshSim"
sim-mode: "Frame-by-frame"
# sim-mode: "AFAP"
time-step: 1e-3 # s
end-time: 3
g-accel: 9.81 # m/s^2
solver-iters: 150
iter-acceleration: 0.0
num-threads: 12
collision-margin: 1e-3

camera-position: [5, 5, 5]

# logging: True
# logging-output-folder: "../output/convergence"
# logging-interval: 10
# log-residuals: True

hdr-image-filename: "../resource/studio_1k.hdr"
create-skybox: True
hdr-scaling: 0.3
fancy-graphics: false

ground-plane: False

objects:
  - 
    type: "Rod"
    name: "rod"
    base-fixed: true
    E: 5e6
    nu: 0.4
    diameter: 0.1
    length: 1
    density: 1000
    elements: 1