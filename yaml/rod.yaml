name: "MeshSim"
# sim-mode: "Frame-by-frame"
# sim-mode: "AFAP"
time-step: 1e-3 # s
end-time: 10
g-accel: 9.81 # m/s^2
solver-iters: 15
iter-acceleration: 0.95
num-threads: 12
collision-margin: 1e-3

camera-position: [5, 5, 5]

# logging: True
# logging-output-folder: "../output/convergence"
# logging-interval: 10
# log-residuals: True

hdr-image-filename: "../resource/studio_1k.hdr"
create-skybox: True
hdr-scaling: 0.3
fancy-graphics: false

ground-plane: True

objects:
  - 
    type: "Rod"
    name: "rod"
    position: [0, 0.5, 0]
    rotation: [0, 0, 0]
    velocity: [0, 0, 1]
    base-fixed: false
    E: 5e6
    nu: 0.4
    diameter: 0.1
    length: 1
    density: 1000
    elements: 20